name: Build and test Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run source tests
        run: npm test && npm run test:native-text

      - name: Run functional OCR test with Windows PowerShell 5.1
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $bitmap = New-Object System.Drawing.Bitmap 1600,320
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.Clear([System.Drawing.Color]::White)
          $font = New-Object System.Drawing.Font("Arial", 64)
          $graphics.DrawString("PRUEBA OCR PDF IGNOVA 1917", $font, [System.Drawing.Brushes]::Black, 40, 90)
          $imagePath = Join-Path $pwd "ocr-test.png"
          $bitmap.Save($imagePath, [System.Drawing.Imaging.ImageFormat]::Png)
          $graphics.Dispose()
          $font.Dispose()
          $bitmap.Dispose()
          $output = & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File scripts\ocr-windows.ps1 -InputPath $imagePath
          if ($LASTEXITCODE -ne 0) { throw "OCR process failed with code $LASTEXITCODE" }
          $result = $output | ConvertFrom-Json
          if (-not $result.lines -or $result.text -notmatch "OCR") {
            throw "OCR did not recognize the functional test: $($result.text)"
          }

      - name: Package Windows x64 application
        run: npm run package:windows

      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler was not found." }
          & $iscc installer\PDF-Ignova-Pro.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed." }

      - name: Verify installation and uninstallation
        shell: pwsh
        run: |
          $setup = Resolve-Path "release-installer\PDF-Ignova-Pro-1.9.17-Setup-Windows-x64-unsigned.exe"
          $installDir = Join-Path $env:RUNNER_TEMP "PDF-Ignova-Pro-test-install"
          $process = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/TASKS=", "/DIR=$installDir" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer returned $($process.ExitCode)." }
          if (-not (Test-Path (Join-Path $installDir "PDF Ignova Pro.exe"))) { throw "Installed executable was not found." }
          $uninstaller = Join-Path $installDir "unins000.exe"
          if (-not (Test-Path $uninstaller)) { throw "Uninstaller was not created." }
          $process = Start-Process -FilePath $uninstaller -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Uninstaller returned $($process.ExitCode)." }
          Start-Sleep -Seconds 2
          if (Test-Path (Join-Path $installDir "PDF Ignova Pro.exe")) { throw "The application was not removed." }

      - name: Create unsigned artifact for SignPath
        shell: pwsh
        run: |
          $folder = Get-ChildItem release -Directory | Select-Object -First 1
          if (-not $folder) { throw "Packaged application folder not found." }
          Compress-Archive -Path (Join-Path $folder.FullName '*') -DestinationPath PDF-Ignova-Pro-1.9.17-Windows-x64-portable-unsigned.zip -Force

      - name: Upload unsigned artifact
        uses: actions/upload-artifact@v7
        with:
          name: pdf-ignova-pro-1.9.17-windows-x64-unsigned
          path: |
            release-installer/PDF-Ignova-Pro-1.9.17-Setup-Windows-x64-unsigned.exe
            PDF-Ignova-Pro-1.9.17-Windows-x64-portable-unsigned.zip
          if-no-files-found: error
