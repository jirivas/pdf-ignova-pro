name: Build and test macOS universal release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run source tests
        run: npm test

      - name: Create macOS application icon
        shell: bash
        run: |
          rm -rf app/icon.iconset
          mkdir -p app/icon.iconset
          sips -z 16 16 app/icon-512.png --out app/icon.iconset/icon_16x16.png >/dev/null
          sips -z 32 32 app/icon-512.png --out app/icon.iconset/icon_16x16@2x.png >/dev/null
          sips -z 32 32 app/icon-512.png --out app/icon.iconset/icon_32x32.png >/dev/null
          sips -z 64 64 app/icon-512.png --out app/icon.iconset/icon_32x32@2x.png >/dev/null
          sips -z 128 128 app/icon-512.png --out app/icon.iconset/icon_128x128.png >/dev/null
          sips -z 256 256 app/icon-512.png --out app/icon.iconset/icon_128x128@2x.png >/dev/null
          sips -z 256 256 app/icon-512.png --out app/icon.iconset/icon_256x256.png >/dev/null
          sips -z 512 512 app/icon-512.png --out app/icon.iconset/icon_256x256@2x.png >/dev/null
          sips -z 512 512 app/icon-512.png --out app/icon.iconset/icon_512x512.png >/dev/null
          sips -z 1024 1024 app/icon-512.png --out app/icon.iconset/icon_512x512@2x.png >/dev/null
          iconutil -c icns app/icon.iconset -o app/icon.icns

      - name: Compile universal native helpers
        run: bash scripts/build-macos-helpers.sh

      - name: Run functional OCR and TIFF tests
        shell: bash
        run: |
          xcrun swiftc -O tests/create-macos-ocr-fixture.swift -o "$RUNNER_TEMP/create-macos-ocr-fixture"
          fixture="$RUNNER_TEMP/ocr-test.png"
          "$RUNNER_TEMP/create-macos-ocr-fixture" "$fixture"
          ocr_result="$(scripts/ocr-macos "$fixture")"
          printf '%s' "$ocr_result" | jq -e '(.lines | length) > 0 and (.text | test("OCR"; "i"))'
          tiff_image="$RUNNER_TEMP/ocr-test.tiff"
          tiff_pages="$RUNNER_TEMP/tiff-pages"
          mkdir -p "$tiff_pages"
          sips -s format tiff "$fixture" --out "$tiff_image" >/dev/null
          tiff_result="$(scripts/convert-tiff-macos "$tiff_image" "$tiff_pages")"
          first_page="$(printf '%s' "$tiff_result" | jq -er '.[0]')"
          test -s "$first_page"

      - name: Package universal macOS application
        run: npm run package:mac

      - name: Verify, ad-hoc sign and smoke-test application
        shell: bash
        run: |
          app_path="release-mac/PDF Ignova Pro-darwin-universal/PDF Ignova Pro.app"
          executable="$app_path/Contents/MacOS/PDF Ignova Pro"
          helper_root="$app_path/Contents/Resources/app.asar.unpacked/scripts"
          test -d "$app_path"
          test -x "$executable"
          test "$(plutil -extract CFBundleShortVersionString raw "$app_path/Contents/Info.plist")" = "1.9.12"
          plutil -p "$app_path/Contents/Info.plist" | grep -q "com.adobe.pdf"
          for binary in "$executable" "$helper_root/ocr-macos" "$helper_root/convert-tiff-macos"; do
            test -x "$binary"
            architectures="$(lipo -archs "$binary")"
            [[ "$architectures" == *x86_64* && "$architectures" == *arm64* ]]
          done
          ELECTRON_RUN_AS_NODE=1 "$executable" -e 'if (!process.versions.electron) process.exit(1)'
          codesign --force --sign - "$helper_root/ocr-macos"
          codesign --force --sign - "$helper_root/convert-tiff-macos"
          codesign --force --deep --sign - "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"

      - name: Create and verify DMG installer
        shell: bash
        run: |
          app_path="release-mac/PDF Ignova Pro-darwin-universal/PDF Ignova Pro.app"
          staging="$RUNNER_TEMP/pdf-ignova-dmg"
          mount_point="$RUNNER_TEMP/pdf-ignova-mounted"
          asset="PDF-Ignova-Pro-1.9.12-macOS-Universal-unnotarized.dmg"
          mkdir -p "$staging" "$mount_point"
          ditto "$app_path" "$staging/PDF Ignova Pro.app"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "PDF Ignova Pro 1.9.12" -srcfolder "$staging" -ov -format UDZO "$asset"
          hdiutil verify "$asset"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_point" "$asset"
          test -d "$mount_point/PDF Ignova Pro.app"
          codesign --verify --deep --strict "$mount_point/PDF Ignova Pro.app"
          hdiutil detach "$mount_point"
          shasum -a 256 "$asset" > "$asset.sha256.txt"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: pdf-ignova-pro-1.9.12-macos-universal-unnotarized
          path: |
            PDF-Ignova-Pro-1.9.12-macOS-Universal-unnotarized.dmg
            PDF-Ignova-Pro-1.9.12-macOS-Universal-unnotarized.dmg.sha256.txt
          if-no-files-found: error
