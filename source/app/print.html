<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Preparando impresión — PDF Ignova Pro</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
        background: #eef2f7;
        color: #172033;
      }

      * { box-sizing: border-box; }

      html, body {
        min-height: 100%;
        margin: 0;
      }

      body {
        background: #eef2f7;
      }

      #status {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        place-items: center;
        padding: 28px;
        background: #eef2f7;
      }

      .status-card {
        width: min(520px, 100%);
        padding: 30px;
        border: 1px solid #d7deea;
        border-radius: 16px;
        background: #fff;
        box-shadow: 0 14px 38px rgba(21, 39, 73, 0.12);
        text-align: center;
      }

      .spinner {
        width: 42px;
        height: 42px;
        margin: 0 auto 18px;
        border: 4px solid #d9e5f8;
        border-top-color: #1268e8;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin { to { transform: rotate(360deg); } }

      h1 {
        margin: 0 0 10px;
        font-size: 21px;
      }

      #progress {
        margin: 0;
        color: #526075;
        font-size: 15px;
        line-height: 1.45;
      }

      #error-actions {
        display: none;
        margin-top: 20px;
      }

      #error-actions button {
        padding: 9px 18px;
        border: 0;
        border-radius: 8px;
        background: #1268e8;
        color: #fff;
        font: 600 14px Arial, sans-serif;
        cursor: pointer;
      }

      body.error .spinner { display: none; }
      body.error #error-actions { display: block; }

      #print-root {
        visibility: hidden;
      }

      .print-sheet {
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 18px auto;
        overflow: hidden;
        break-after: page;
        page-break-after: always;
        background: #fff;
        box-shadow: 0 3px 18px rgba(22, 34, 55, 0.18);
      }

      .print-sheet:last-child {
        break-after: auto;
        page-break-after: auto;
      }

      .print-sheet img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      @media print {
        html, body, #print-root {
          margin: 0;
          padding: 0;
          background: #fff;
        }

        #status { display: none !important; }
        #print-root { visibility: visible; }

        .print-sheet {
          margin: 0;
          box-shadow: none;
        }
      }
    </style>
  </head>
  <body>
    <section id="status" aria-live="polite">
      <div class="status-card">
        <div class="spinner" aria-hidden="true"></div>
        <h1 id="status-title">Preparando impresión</h1>
        <p id="progress">Leyendo el documento…</p>
        <div id="error-actions">
          <button type="button" id="close-button">Cerrar</button>
        </div>
      </div>
    </section>
    <main id="print-root" aria-hidden="true"></main>
    <script type="module" src="./print-entry.js"></script>
  </body>
</html>
