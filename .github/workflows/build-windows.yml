name: Build Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Package Windows x64 application
        run: npm run package:windows

      - name: Create unsigned artifact for SignPath
        shell: pwsh
        run: |
          $folder = Get-ChildItem release -Directory | Select-Object -First 1
          if (-not $folder) { throw "Packaged application folder not found." }
          Compress-Archive -Path (Join-Path $folder.FullName '*') -DestinationPath PDF-Ignova-Pro-Windows-x64-unsigned.zip -Force

      - name: Upload unsigned artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf-ignova-pro-windows-x64-unsigned
          path: PDF-Ignova-Pro-Windows-x64-unsigned.zip
          if-no-files-found: error
