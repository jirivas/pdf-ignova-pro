name: Build Windows release

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "source/**"
      - ".github/workflows/build-windows.yml"
  push:
    branches:
      - main
    paths:
      - "source/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout public source repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        working-directory: source
        run: npm ci

      - name: Run source tests
        working-directory: source
        run: npm test

      - name: Run functional OCR test with Windows PowerShell 5.1
        working-directory: source
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $bitmap = New-Object System.Drawing.Bitmap 1600,320
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.Clear([System.Drawing.Color]::White)
          $font = New-Object System.Drawing.Font("Arial", 64)
          $graphics.DrawString("PRUEBA OCR PDF IGNOVA 1910", $font, [System.Drawing.Brushes]::Black, 40, 90)
          $imagePath = Join-Path $pwd "ocr-test.png"
          $bitmap.Save($imagePath, [System.Drawing.Imaging.ImageFormat]::Png)
          $graphics.Dispose()
          $font.Dispose()
          $bitmap.Dispose()
          $output = & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File scripts\ocr-windows.ps1 -InputPath $imagePath
          if ($LASTEXITCODE -ne 0) { throw "OCR process failed with code $LASTEXITCODE" }
          $result = $output | ConvertFrom-Json
          if (-not $result.lines -or $result.text -notmatch "OCR") {
            throw "OCR did not recognise the functional test: $($result.text)"
          }
          Write-Host "Recognised text: $($result.text)"

      - name: Package Windows x64 application
        working-directory: source
        run: npm run package:windows

      - name: Verify packaged application and helper scripts
        shell: pwsh
        run: |
          $root = "source/release"
          $folder = Get-ChildItem $root -Directory | Select-Object -First 1
          if (-not $folder) { throw "Packaged application folder not found." }
          $exe = Join-Path $folder.FullName "PDF Ignova Pro.exe"
          if (-not (Test-Path $exe)) { throw "PDF Ignova Pro.exe was not produced." }
          $helpers = Join-Path $folder.FullName "resources/app.asar.unpacked/scripts"
          if (-not (Test-Path (Join-Path $helpers "ocr-windows.ps1"))) { throw "OCR helper was not unpacked." }
          if (-not (Test-Path (Join-Path $helpers "convert-office.ps1"))) { throw "Office helper was not unpacked." }

      - name: Compile Windows installer
        working-directory: source
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler was not found." }
          & $iscc installer\PDF-Ignova-Pro.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed." }

      - name: Verify installation and uninstallation
        shell: pwsh
        run: |
          $setup = Resolve-Path "source/release-installer/PDF-Ignova-Pro-1.9.10-Setup-Windows-x64-unsigned.exe"
          $installDir = Join-Path $env:RUNNER_TEMP "PDF-Ignova-Pro-test-install"
          $process = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/TASKS=", "/DIR=$installDir" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer returned $($process.ExitCode)." }
          if (-not (Test-Path (Join-Path $installDir "PDF Ignova Pro.exe"))) { throw "Installed executable was not found." }
          $uninstaller = Join-Path $installDir "unins000.exe"
          if (-not (Test-Path $uninstaller)) { throw "Uninstaller was not created." }
          $process = Start-Process -FilePath $uninstaller -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Uninstaller returned $($process.ExitCode)." }
          Start-Sleep -Seconds 2
          if (Test-Path (Join-Path $installDir "PDF Ignova Pro.exe")) { throw "The application was not removed." }

      - name: Create release files
        shell: pwsh
        run: |
          $source = "source"
          $folder = Get-ChildItem "$source/release" -Directory | Select-Object -First 1
          $portable = "PDF-Ignova-Pro-1.9.10-Windows-x64-portable-unsigned.zip"
          $setup = "PDF-Ignova-Pro-1.9.10-Setup-Windows-x64-unsigned.exe"
          $sourceZip = "PDF_Ignova_Pro_1.9.10_Codigo_Fuente_GPLv3.zip"
          Compress-Archive -Path (Join-Path $folder.FullName '*') -DestinationPath $portable -Force
          Copy-Item "$source/release-installer/$setup" $setup -Force

          $sourceRoot = Join-Path $env:RUNNER_TEMP "PDF_Ignova_Pro_1.9.10_Source"
          New-Item -ItemType Directory -Path $sourceRoot -Force | Out-Null
          $trackedFiles = git ls-files "source/**" ".github/workflows/**"
          foreach ($trackedFile in $trackedFiles) {
            $relativePath = if ($trackedFile.StartsWith("source/")) {
              $trackedFile.Substring(7)
            } else {
              $trackedFile
            }
            $destination = Join-Path $sourceRoot $relativePath
            New-Item -ItemType Directory -Path (Split-Path $destination -Parent) -Force | Out-Null
            Copy-Item $trackedFile $destination -Force
          }
          tar -a -c -f $sourceZip -C $env:RUNNER_TEMP "PDF_Ignova_Pro_1.9.10_Source"

          foreach ($asset in @($setup, $portable, $sourceZip)) {
            $digest = (Get-FileHash -Algorithm SHA256 $asset).Hash.ToLowerInvariant()
            "$digest  $asset" | Set-Content -Encoding ascii "$asset.sha256.txt"
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pdf-ignova-pro-1.9.10-windows-x64-unsigned
          path: |
            PDF-Ignova-Pro-1.9.10-Setup-Windows-x64-unsigned.exe
            PDF-Ignova-Pro-1.9.10-Setup-Windows-x64-unsigned.exe.sha256.txt
            PDF-Ignova-Pro-1.9.10-Windows-x64-portable-unsigned.zip
            PDF-Ignova-Pro-1.9.10-Windows-x64-portable-unsigned.zip.sha256.txt
            PDF_Ignova_Pro_1.9.10_Codigo_Fuente_GPLv3.zip
            PDF_Ignova_Pro_1.9.10_Codigo_Fuente_GPLv3.zip.sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release 1.9.10
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v1.9.10"
          $title = "PDF Ignova Pro 1.9.10"
          $assets = @(
            "PDF-Ignova-Pro-1.9.10-Setup-Windows-x64-unsigned.exe",
            "PDF-Ignova-Pro-1.9.10-Setup-Windows-x64-unsigned.exe.sha256.txt",
            "PDF-Ignova-Pro-1.9.10-Windows-x64-portable-unsigned.zip",
            "PDF-Ignova-Pro-1.9.10-Windows-x64-portable-unsigned.zip.sha256.txt",
            "PDF_Ignova_Pro_1.9.10_Codigo_Fuente_GPLv3.zip",
            "PDF_Ignova_Pro_1.9.10_Codigo_Fuente_GPLv3.zip.sha256.txt"
          )
          $notes = @"
          PDF Ignova Pro 1.9.10 para Windows 10/11 x64.

          Descarga recomendada: el archivo Setup.exe. Instala accesos directos y añade la desinstalación normal desde Configuración > Aplicaciones. El ZIP portátil se mantiene como alternativa.

          Novedades y correcciones:
          - Guardar como abre directamente el selector nativo unido a la ventana activa.
          - Se bloquean aperturas duplicadas del selector de guardado.
          - La sustitución de un PDF existente conserva una copia recuperable hasta completar la escritura.
          - Tapado sale de la barra superior y pasa al nuevo menú Dibujo, con selector de color.
          - OCR verificado de forma funcional con Windows PowerShell 5.1.
          - Instalación y desinstalación verificadas automáticamente.
          - Conserva las mejoras de organización, texto, zoom, OCR e impresión de 1.9.9.

          Aplicación sin firma digital. Windows puede mostrar una advertencia de SmartScreen.
          "@
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $assets --clobber --repo $env:GITHUB_REPOSITORY
            gh release edit $tag --title $title --notes $notes --latest --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag $assets --target $env:GITHUB_SHA --title $title --notes $notes --latest --repo $env:GITHUB_REPOSITORY
          }
