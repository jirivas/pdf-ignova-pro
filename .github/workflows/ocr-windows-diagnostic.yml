name: Diagnose Windows OCR

on:
  push:
    branches:
      - ocr-installer-fix-195
    paths:
      - ".github/workflows/ocr-windows-diagnostic.yml"
  workflow_dispatch:

jobs:
  ocr:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Extract source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path _src | Out-Null
          Expand-Archive -LiteralPath "PDF_Ignova_Pro_1.9.4_Codigo_Fuente_GPLv3.zip" -DestinationPath _src -Force

      - name: Generate OCR image
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Drawing
          $image = New-Object System.Drawing.Bitmap 1600,320
          $graphics = [System.Drawing.Graphics]::FromImage($image)
          $graphics.Clear([System.Drawing.Color]::White)
          $font = New-Object System.Drawing.Font("Arial", 64, [System.Drawing.FontStyle]::Regular)
          $brush = [System.Drawing.Brushes]::Black
          $graphics.DrawString("PRUEBA OCR PDF IGNOVA 195", $font, $brush, 40, 90)
          $image.Save((Join-Path $pwd "ocr-test.png"), [System.Drawing.Imaging.ImageFormat]::Png)
          $graphics.Dispose()
          $font.Dispose()
          $image.Dispose()

      - name: Execute OCR using Windows PowerShell 5.1
        shell: pwsh
        run: |
          $source = Resolve-Path "_src/PDF_Ignova_Pro_1.9.4_Source"
          $script = Join-Path $source "scripts/ocr-windows.ps1"
          $image = Resolve-Path "ocr-test.png"
          $output = & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File $script -InputPath $image
          if ($LASTEXITCODE -ne 0) { throw "OCR process failed with code $LASTEXITCODE" }
          Write-Host $output
          $result = $output | ConvertFrom-Json
          if (-not $result.lines) { throw "OCR returned no lines" }
          if ($result.text -notmatch "OCR") { throw "OCR did not recognize the test text: $($result.text)" }
